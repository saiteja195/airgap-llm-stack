apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-qdrant
  labels: {{- include "airgap.labels" . | nindent 4 }}
spec:
  serviceName: {{ .Release.Name }}-qdrant
  replicas: 1
  selector:
    matchLabels: {{- include "airgap.selector" (dict "ctx" $ "c" "qdrant") | nindent 6 }}
  template:
    metadata:
      labels: {{- include "airgap.selector" (dict "ctx" $ "c" "qdrant") | nindent 8 }}
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: qdrant
          image: {{ include "airgap.image" .Values.image.qdrant }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 6333 }]
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 5 }
          securityContext: { allowPrivilegeEscalation: false, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.qdrant.resources | nindent 12 }}
          volumeMounts:
            - { name: data, mountPath: /qdrant/storage }
            - { name: snapshots, mountPath: /qdrant/snapshots }   # image dir is root-owned; Qdrant panics at startup if it cannot create snapshots/tmp
      volumes:
        - { name: snapshots, emptyDir: {} }
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        {{- if .Values.qdrant.persistence.storageClass }}
        storageClassName: {{ .Values.qdrant.persistence.storageClass }}
        {{- end }}
        resources: { requests: { storage: {{ .Values.qdrant.persistence.size }} } }
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-qdrant
  labels: {{- include "airgap.labels" . | nindent 4 }}
spec:
  selector: {{- include "airgap.selector" (dict "ctx" $ "c" "qdrant") | nindent 4 }}
  ports: [{ name: http, port: 6333, targetPort: http }]
