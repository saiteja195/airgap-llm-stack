apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{- include "airgap.labels" . | nindent 4 }}
---
# Read-only access to NetworkPolicies in this namespace, so the console can show what enforces the air gap.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-agent
rules:
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-agent
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: {{ .Release.Name }}-agent }
subjects:
  - { kind: ServiceAccount, name: {{ .Release.Name }}-agent }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{- include "airgap.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels: {{- include "airgap.selector" (dict "ctx" $ "c" "agent") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "airgap.selector" (dict "ctx" $ "c" "agent") | nindent 8 }}
        airgap/role: client
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      securityContext: { runAsNonRoot: true, runAsUser: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: agent
          image: {{ include "airgap.image" .Values.image.agent }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: OLLAMA_URL, value: "http://{{ .Release.Name }}-ollama:11434" }
            - { name: QDRANT_URL, value: "http://{{ .Release.Name }}-qdrant:6333" }
            - { name: GEN_MODEL, value: {{ .Values.model.generation | quote }} }
            - { name: EMBED_MODEL, value: {{ .Values.model.embedding | quote }} }
            - { name: TOP_K, value: {{ .Values.agent.topK | quote }} }
            - { name: GATE_MODE, value: {{ .Values.agent.gate.mode | quote }} }
            - { name: GATE_MODEL, value: {{ .Values.agent.gate.model | quote }} }
            - { name: GATE_MIN_SCORE, value: {{ .Values.agent.gate.minScore | quote }} }
            - { name: INSTALL_STEPS, value: {{ .Values.agent.installSteps | quote }} }
            - { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
            - name: AGENT_API_KEY
              valueFrom: { secretKeyRef: { name: {{ include "airgap.secretName" . }}, key: api-key } }
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20 }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
          resources: {{- toYaml .Values.agent.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-agent
  labels: {{- include "airgap.labels" . | nindent 4 }}
spec:
  selector: {{- include "airgap.selector" (dict "ctx" $ "c" "agent") | nindent 4 }}
  ports: [{ name: http, port: 8080, targetPort: http }]
