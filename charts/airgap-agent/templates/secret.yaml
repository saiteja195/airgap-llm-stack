{{- if not .Values.secret.existingSecret }}
{{- $name := printf "%s-agent" .Release.Name }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels: {{- include "airgap.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ if $existing }}{{ index $existing.data "api-key" }}{{ else }}{{ randAlphaNum 32 | b64enc }}{{ end }}
{{- end }}
